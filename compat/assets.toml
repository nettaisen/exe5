# EXE5's asset names, written by tools/exe5/gen_content.py (bn6battle-verify) from the EXE5 ROMs,
# by EXE6's names for what is EXE6's (gen_content.py's `asset_names`: the songs and sprites whose data is
# EXE6's, EXE5's music and sprites by the place EXE5's code uses them where EXE6's same code uses a named one,
# the banners whose records are EXE6's). The extractor writes each asset under its name here, the rest under a
# number (`sprite-cc-ii`, `sound-nnn`, `banner-nn`), which content may not use.

# Sprites: "cc-ii", the category's byte offset in the sprite list (0x08032728) and the index. Category 20 is the
# chatbox's portraits (a no-running message's speaker: its script's `F5 00 ii`), each from the team's ROM that
# has its face (the other's has a placeholder for four or five of them: navis its console can't operate).
