# Backgrounds: battle background numbers (settings byte 4), each named for the area whose maps draw it: a battle
# draws its map's (0x0808CA78: the table at 0x0808CAAC by map group and number; 0x06 for a real-world map) unless
# its settings state one. The names are the menu's (0x08128B50), in full where its twelve characters cut one
# short; the engine's docs/frontend.md §1 has the table of them, tools/backgrounds the names and their areas
# from the ROM. A link battle draws one of 0x00 to 0x1a (0x08129F2C's table at 0x08129F6C). A liberation's map
# has its own number with its area's load data, scroll and animations (0x0c 0x08's, 0x0d 0x09's, 0x0e 0x0a's,
# 0x12 and 0x14 0x0f's, 0x1a 0x18's, 0x1c 0x19's), so it is its area's background: a name with a list is one
# background, the extractor's picture of its first number, and each number in the list draws it.
[backgrounds]
main_comp = 0x00  # MainComp1 and 2
drill_comp = 0x01  # DrillComp1 to 4
lans_hp = 0x02  # Lan's HP
mayls_hp = 0x03  # Mayl's HP
dexs_hp = 0x04  # Dex's HP
yais_hp = 0x05  # Yai's HP
# the default: 35 comps (DoghouseComp, the Kitchen, Engine and Armor comps, eleven of the SquirrelCmps and so on),
# every real-world map, and what a link battle's settings state
comp = 0x06
# eleven comps (OldTrmnlComp, RadarComp, AirConComp, ScrewComp, ServerComp, MessageComp and SquirrelCmp2, 7, 9, 12 and
# 14): 0x06's picture in another palette; the comps share their map tiles, and nothing else in the data sets these
# apart
comp_alternate = 0x07
acdc_area = [0x08, 0x0c]  # ACDC Area1, 2 and 3 (0x0c: Area3, the first liberation's map)
oran_area = [0x09, 0x0d]  # Oran Area1, 2 and 3 (0x0d: Area3, the second liberation's)
scilab_area = [0x0a, 0x0e]  # SciLab1 to 4 ("SciLab Area" in dialogue; 0x0e: SciLab3, the third liberation's)
# the three VisionBursts (map group 0x8A): the menu names none of them; their own dialogue shows what they are, and
# the game's word is the dialogue's ("VisionBurst of ACDC Town")
vision_burst = 0x0b
end_area = [0x0f, 0x12, 0x14]  # End Area1 to 5 (0x12: Area2, the fourth liberation's; 0x14: Area5, the fifth's)
ship_comp = 0x10  # ShipComp1 to 3
scilab_hp = 0x11  # SciLab HP
gargoyle_castle_hp = 0x13  # GargCastleHP
soul_server_comp = 0x15  # SoulServComp
gargoyle_comp = 0x16  # GargoylComp1 to 3 ("Gargoyle" in dialogue)
factory_comp = 0x17  # FactoryComp1 to 4
undernet = [0x18, 0x1a]  # Undernet1 to 4 (0x1a: Undernet4, the sixth liberation's); NebulaArea6 too
nebula_area = [0x19, 0x1c]  # NebulaArea1 to 5 (0x1c: NebulaArea1, 3 and 5, the last three liberations')
# no map's: the two NebulaGray battles' settings state it (0x081140E0, 0x08114270); the game's text places the fight
# on the SoulServer, whose comp draws 0x15
nebula_gray = 0x1b

