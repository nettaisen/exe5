# EXE5's object kinds: the original's pool and index (the traces compare them), and the positions the comparison
# skips (register garbage the spawner leaves until the kind's init places it), and the statuses it skips
# (`scratch_status`: no collision behind the object's +0x54), and the kinds whose Z keeps their spawner's address as they
# move (`z_moves_from_spawner`: on another ROM's console that Z is as far from the content's as the addresses are, by
# games.toml) or fall from it (`z_falls_from_spawner`, the ticks: on another ROM's console they fall from that ROM's),
# and the header-flag bits the other side's console reads off its open bus on the tick a round's actors are spawned
# (`round_start_open_bus_flags`: a first barrier's visual asking whether a navi with no collision data yet is blind;
# skipped on that tick): exe5-compat's comparison reads them.
# Written by hand from the EXE5 recordings and code, as kinds come up in the replays: edit it when content is renamed
# or added. A key without a root is EXE5's own (most made with content/exelib's shared code); `engine/...` the
# engine's.

