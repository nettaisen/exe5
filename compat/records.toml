# EXE5's numbers of what its NaviStats and its save name (exe5-compat's NaviStats conversion and save import read
# them). Written by hand from the EXE5 ROM: edit it when content is renamed or added. A key without a root is EXE5's own; a qualified one
# (`exe6:...`) is EXE6's definition, which EXE5's code shares.

# Navis: the navi numbers NaviStats +0x29 names (and a save's GameState +1, the navi its PET operates): MegaMan, then
# the team navis the content has (Team ProtoMan's are 1 to 6, Team Colonel's 7 to 12, each team in its souls' order).
[navis]
"megaman" = 0
"protoman" = 1
"colonel" = 7
"searchman" = 3
"meddy" = 6
"gyroman" = 2
"napalmman" = 4
"magnetman" = 5
"shadowman" = 8
"numberman" = 9
"tomahawkman" = 10
"knightman" = 11
"toadman" = 12

# Weapons: the weapon routine numbers (0x0800F370, EXE6's `off_80117D4`) NaviStats +0x04 (buster), +0x05 (charged
# shot), +0x07 (B+Back) and +0x39 (A charge) name; 0xFF none.
[weapons]
"megaman/buster" = [0x00]
"megaman/charged_shot" = [0x01]
# The NaviCust programs' B+Back specials (navis/megaman/weapons/guards): Shield's, Reflect's (the program's 0x61; 0x20
# the same routine), AntiDmg's. A weapon's first number is the one its program writes.
"megaman/shield" = [0x1F]
"megaman/reflect" = [0x61, 0x20]
"megaman/anti_damage" = [0x21]
# The patch cards' B buttons, charged shots and B+Back specials (navis/megaman/weapons: chips, guards, buster,
# charged-shot, spreads, instants, fire-arm, zap-ring, rapid-buster, hells-rolling).
"megaman/card_shield" = [0x62]
"megaman/tri_buster" = [0x65]
"megaman/program_charged_shot" = [0x63]
"megaman/zap_ring" = [0x42]
"megaman/invisible" = [0x47]
"megaman/long_sword" = [0x48]
"megaman/thunder" = [0x49]
"megaman/heat_shot" = [0x4A]
"megaman/yo_yo" = [0x4B]
"megaman/vacuum" = [0x4C]
"megaman/katana_1" = [0x4D]
"megaman/fire_arm" = [0x4E]
"megaman/pulsar_1" = [0x50]
"megaman/poltergeist" = [0x51]
"megaman/wide_sword" = [0x52]
"megaman/mini_bomb" = [0x53]
"megaman/cannon_ball" = [0x54]
"megaman/tornado" = [0x55]
"megaman/bubble_shot" = [0x56]
"megaman/crack_out" = [0x57]
"megaman/moon_blade_1" = [0x58]
"megaman/air_hockey" = [0x59]
"megaman/circle_gun" = [0x5A]
"megaman/drill_arm_1" = [0x5B]
"megaman/wide_blade" = [0x5C]
"megaman/black_bomb" = [0x5D]
"megaman/sea_seed" = [0x5E]
"megaman/tank_cannon_1" = [0x5F]
"megaman/dark_sword" = [0x60]
"megaman/sword" = [0x64]
"megaman/boomerang" = [0x66]
"megaman/wide_shot_1" = [0x67]
"megaman/rapid_buster" = [0x68]
"megaman/hells_rolling" = [0x69]
"megaman/guard_1" = [0x6A]
"megaman/curse_shield_1" = [0x6B]
# The team navis' weapons (navis/<navi>: their stats rows' routines, 0x0801D55F's +0x05 and +0x07; their busters are
# routine 0, MegaMan's).
"protoman/charge" = [0x1E]
"protoman/back" = [0x0B]
"colonel/charge" = [0x46]
"searchman/charge" = [0x3F]
"meddy/charge" = [0x3B]
"gyroman/buster" = [0x43]
"gyroman/charge" = [0x28]
"napalmman/buster" = [0x44]
"napalmman/a_charge" = [0x29]
"magnetman/charge" = [0x26]
"magnetman/a_charge" = [0x2A]
# ShadowMan's shuriken from above, and his B+Back anti-damage stance.
"shadowman/charge" = [0x24]
"shadowman/back" = [0x0D]
# TomahawkMan's thrown tomahawk, and his A charge (+0x39: an empty routine, his charged Wood chips').
"tomahawkman/charge" = [0x3C]
"tomahawkman/a_charge" = [0x2B]
# KnightMan's wrecking ball's swing.
"knightman/charge" = [0x10]
# NumberMan's die throw.
"numberman/charge" = [0x3D]
# ToadMan's dive, and his A charge (+0x39: an empty routine, his charged Aqua chips').
"toadman/charge" = [0x2E]
"toadman/a_charge" = [0x2C]

# Projectile variants: the projectile table's rows (0x080C4718, EXE6's `off_80C4C78`) the buster-shot and
# charged-shot programs (NaviStats +0x4D, +0x4F) name; the buster's and the charged shot's own, and the chips'.
# (As a shot program the byte 0 is no program: a shot with none is the plain shot.)
[projectile_variants]
"shot/plain" = 0x00
"shot/cannon" = 0x01
"shot/bright" = 0x03
"shot/air" = 0x04
"shot/charged" = 0x06
"shot/giga_cannon" = 0x0C
# The patch cards' buster-shot and charged-shot programs (objects/projectile/variants), and Hub Style's spread.
"shot/breaking" = 0x05
"shot/cracking" = 0x07
"shot/poisoning" = 0x08
"shot/chip_destruction" = 0x09
"shot/grass" = 0x0D
"shot/ice" = 0x0E
"shot/hub" = 0x12
"shot/sea" = 0x14
"shot/charged_confusing" = 0x15
"shot/charged_paralyzing" = 0x16
"shot/charged_blinding" = 0x17
"shot/charged_cracking" = 0x18
"shot/charged_panel_breaking" = 0x19
"shot/charged_lava" = 0x1A
"shot/charged_poisoning" = 0x1B
"shot/charged_attack_a0" = 0x1C
"shot/charged_uninstalling" = 0x1D
"shot/charged_hp_bug" = 0x1E

# The barriers NaviStats +0x06 names as the one a navi enters with (0 none): FstBarr's (1), the Barrier chip's
# (lib/barriers: EXE6's rows, EXE5's visual).
[barriers]
"barrier/10" = 1
"barrier/100" = 5
"barrier/200" = 7
"barrier/bubble" = 8
"barrier/life_aura" = 9

# MegaMan's forms: the number NaviStats +0x2C names (0: no soul, his base form; 1 to 12 his souls, in the order of the
# navis he unites with, 0x0873BBC8's names). The original numbers a soul everywhere (its sprite 00-0n, its rows of
# the weapon and attach point tables, its bit of the round's souls given, the save's soul flags by version); the
# content names a soul by its form's id, and what reads a recording or a save finds the form here.
[forms]
"base" = 0
"proto_soul" = 1
"gyro_soul" = 2
"search_soul" = 3
"napalm_soul" = 4
"magnet_soul" = 5
"meddy_soul" = 6
"colonel_soul" = 7
"shadow_soul" = 8
"number_soul" = 9
"tomahawk_soul" = 10
"knight_soul" = 11
"toad_soul" = 12

# The save's SP navi deletion times (0x2670, 22 halfwords: a chip's slot is its chip record's +0x1A less 0x3E9, the
# same in the four ROMs), by the SP chip whose damage goes by each slot's time (the rules' `sp_times`). Roll SP's slot
# (0) and Django SP's (21) hold times no damage reads (theirs is a count); no chip's record names 19 or 20.
[sp_slots]
"protoman_sp" = 1
"gyroman_sp" = 2
"searchman_sp" = 3
"napalmman_sp" = 4
"magnetman_sp" = 5
"meddy_sp" = 6
"colonel_sp" = 7
"shadowman_sp" = 8
"numberman_sp" = 9
"tomahawkman_sp" = 10
"knightman_sp" = 11
"toadman_sp" = 12
"shademan_sp" = 13
"blizzardman_sp" = 14
"cloudman_sp" = 15
"cosmoman_sp" = 16
"larkman_sp" = 17
"gridman_sp" = 18
