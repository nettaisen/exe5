# EXE5's battle themes (docs/design/asset-formats.md §8): the songs a player may pick as a battle's music in place of
# its game's own, in this game's battles or another's, as a list shows them. Each is the music the original's battle
# settings records start (their byte 2) for a kind of battle: the virus battles' (957 records), the boss battles'
# (141, the navis') and the two against NebulaGray (../compat/assets.toml). Their names are the locales'
# (`battle_themes`, by asset name). Presentation, read with the locales: no tick reads them, so the content hash
# leaves them out.
themes = ["virus-battle", "boss-battle", "final-battle", "glory-to-hong-kong", "national-anthem-of-the-roc"]

# Glory to Hong Kong (願榮光歸香港, 2019) arranged in the style of BN5's battle theme, "Virus Busting", on its instruments
# (song 21): its voicegroup, reverb and priority, five tracks. Made from bnmusic's glory_to_hong_kong_bn5_style (its .s)
# by nettai-verify's tools/songs/m4a_to_midi.py.
[songs.glory-to-hong-kong]
file = "music/glory_to_hong_kong.mid"
voices = "virus-battle"

# The National Anthem of the Republic of China (中華民國國歌, San Min Chu-i; music by Cheng Mao-yun, 1928, public domain)
# arranged in the style of BN5's battle theme, "Virus Busting", on its instruments (song 21): its voicegroup, reverb and
# priority, five tracks. Made from bnmusic's san_min_chu_i_bn5_style (its .s) by nettai-verify's
# tools/songs/m4a_to_midi.py.
[songs.national-anthem-of-the-roc]
file = "music/national_anthem_of_the_roc.mid"
voices = "virus-battle"
